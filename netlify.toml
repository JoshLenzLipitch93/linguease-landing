[build]
  publish = "src"
  # Static site — no build step.

# ---------------------------------------------------------------------------
# Clean URLs for the pages the live App Store listing links to.
# These paths MUST keep resolving — App Review reads /privacy-policy and
# /support. Explicit rewrites rather than relying on Netlify's Pretty URLs.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/terms-of-use"
  to = "/terms-of-use.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms-of-use.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# site.css and site.js are not fingerprinted, so a long max-age means a
# returning visitor gets today's HTML with yesterday's stylesheet — which
# is a broken page, not a stale one. Revalidate instead; both files are
# small and Netlify answers with a 304 off the ETag.
[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ---------------------------------------------------------------------------
# Short campaign paths for the social channels.
#
# CLICK LOG (9 Nov 2026): every short path goes through the linguease-links
# Worker, which records the click (time, link, country, source; no IP) and then
# redirects to the real target. Targets and campaign tokens live in that
# Worker's src/links.js; a new link needs a line there AND a redirect here.
#
# SCHEME — platform first, account as a suffix. The launch account
# (@easybrazillian_pt) takes the bare paths; later accounts add a suffix.
#
#   /ig      → ebpt-ig-bio     Instagram bio, Brazilian Portuguese  (LIVE)
#   /tt      → ebpt-tt-bio     TikTok bio, same account             (not yet)
#   /ig-es   → luna-ig-bio     Instagram bio, Spanish account (Luna), straight to the store
#   /tt-es   → ebes-tt-bio     TikTok bio, Spanish account          (not yet)
#
# The path is what a person sees in the address bar, so it stays short and
# honest; the campaign token behind it is what App Store Connect reports on.
# analytics.js reads ?ct= at runtime and stamps pt+ct onto every store link.
#
# A suffix, never a namespace: /es/... or /pt/... would squat the routes a
# localised version of this site would want. /ig-es cannot collide.
#
# Add a path only when its channel actually exists — a live redirect to a
# campaign token nobody is using pollutes the App Store Connect report.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/ig"
  to = "https://linguease-links.joshlenzlipitch.workers.dev/ig"
  status = 302
  force = true

[[redirects]]
  from = "/ig2"
  to = "https://linguease-links.joshlenzlipitch.workers.dev/ig2"
  status = 302
  force = true

# Same account, straight to the store (skips the site).
[[redirects]]
  from = "/ig2-app"
  to = "https://linguease-links.joshlenzlipitch.workers.dev/ig2-app"
  status = 302
  force = true

# Spanish account (Luna, Instagram bio). Straight to the store: the site is
# Portuguese-only, so a Spanish learner would bounce off it.
[[redirects]]
  from = "/ig-es"
  to = "https://linguease-links.joshlenzlipitch.workers.dev/ig-es"
  status = 302
  force = true

# Main Linguease Instagram (@linguease.app) bio. Straight to the store, tagged so
# App Store Connect can count its views and downloads (replaces an untagged bit.ly).
[[redirects]]
  from = "/app"
  to = "https://linguease-links.joshlenzlipitch.workers.dev/app"
  status = 302
  force = true
